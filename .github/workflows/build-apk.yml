name: Build EcoChoice APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip EcoChoice project
        run: |
          rm -rf extracted
          unzip -q ecochoice_android_project_v17.zip -d extracted
          PROJECT_DIR=$(find extracted -maxdepth 3 -name settings.gradle.kts -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Patch Android resources before build
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace('        android:roundIcon="@drawable/ic_leaf_round"\n', '')
          manifest.write_text(text)

          themes = Path("app/src/main/res/values/themes.xml")
          themes.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.EcoChoice" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          """)
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcoChoice-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
